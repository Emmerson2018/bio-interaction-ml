name: E04_MobileNetV3_Small_Finetune_Real_R1
model_type: ClassificationModel
num_gpu: 1

runtime:
  device: cuda
  require_cuda: true
  cuda_device: 0
  mixed_precision: true

datasets:
  train:
    type: ImageFolderClassificationDataset
    root: datasets/finetune_multiclass_v1_r1/train
    image_size: 224
    augment: true
    batch_size_per_gpu: 16
    num_worker_per_gpu: 0
  val:
    type: ImageFolderClassificationDataset
    root: datasets/finetune_multiclass_v1_r1/val
    image_size: 224
    augment: false
  test:
    type: ImageFolderClassificationDataset
    root: datasets/finetune_multiclass_v1_r1/test
    image_size: 224
    augment: false

network_g:
  type: TorchvisionClassifier
  backbone: mobilenet_v3_small
  num_classes: 5
  weights:
  pretrained_checkpoint: experiments/E04_MobileNetV3_Small_ImageNet_MulticlassV1/models/best.pth
  classifier_dropout: 0.35
  freeze_backbone: true

train:
  seed: 43
  deterministic: false
  num_epochs: 12
  total_epochs: 12
  unfreeze_epoch: 2
  save_checkpoint_freq: 1
  val_freq: 1
  optimizer:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-2
  scheduler:
    type: StepLR
    step_size: 4
    gamma: 0.5
  checkpoint:
    monitor: val_macro_f1
    mode: max
    save_best: true
    save_last: true
  early_stopping:
    enabled: true
    monitor: val_macro_f1
    mode: max
    patience: 4
    min_delta: 0.001
  metrics:
    accuracy:
      type: AccuracyMetric

logger:
  print_freq: 25
  save_checkpoint_freq: 1

visualization:
  training_plots:
    type: LossVisualizer
