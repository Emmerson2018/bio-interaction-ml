name: E04_MobileNetV3_Small_ImageNet_MulticlassV1_Smoke
model_type: ClassificationModel
num_gpu: 1

datasets:
  train:
    type: ImageFolderClassificationDataset
    root: datasets/generated/animals_multiclass_v1/train
    image_size: 224
    augment: true
    batch_size_per_gpu: 32
    num_worker_per_gpu: 0
  val:
    type: ImageFolderClassificationDataset
    root: datasets/generated/animals_multiclass_v1/val
    image_size: 224
    augment: false
  test:
    type: ImageFolderClassificationDataset
    root: datasets/generated/animals_multiclass_v1/test
    image_size: 224
    augment: false

network_g:
  type: TorchvisionClassifier
  backbone: mobilenet_v3_small
  num_classes: 4
  weights: DEFAULT
  classifier_dropout: 0.2
  freeze_backbone: false

train:
  seed: 42
  deterministic: false
  total_epochs: 1
  save_checkpoint_freq: 1
  val_freq: 1
  optimizer:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-2
  scheduler:
    type: StepLR
    step_size: 1
    gamma: 0.5
  checkpoint:
    monitor: val_macro_f1
    mode: max
    save_best: true
    save_last: true
  early_stopping:
    enabled: false
  metrics:
    accuracy:
      type: AccuracyMetric

logger:
  print_freq: 50
  save_checkpoint_freq: 1

visualization:
  training_plots:
    type: LossVisualizer
