name: Exp_RepViT_M0_9_SAM2_Crops
model_type: ClassificationModel
num_gpu: 1

datasets:
  train:
    type: ImageFolderClassificationDataset
    root: datasets/generated/animals_video_sam2_crops/train
    image_size: 224
    grayscale: false
    augment: true
    randaugment_magnitude: 7
    randaugment_ops: 2
    batch_size_per_gpu: 128
    num_worker_per_gpu: 4
  val:
    type: ImageFolderClassificationDataset
    root: datasets/generated/animals_video_sam2_crops/val
    image_size: 224
    grayscale: false
    augment: false
    batch_size_per_gpu: 128
    num_worker_per_gpu: 4
  test:
    type: ImageFolderClassificationDataset
    root: datasets/generated/animals_video_sam2_crops/test
    image_size: 224
    grayscale: false
    augment: false
    batch_size_per_gpu: 128
    num_worker_per_gpu: 4

network_g:
  type: TimmClassifier
  architecture: repvit_m0_9
  num_classes: 16
  pretrained: true
  freeze_backbone: false
  dropout: 0.20

train:
  two_stage:
    enabled: true
    freeze_epochs: 2
    head_lr: !!float 2e-3
  differential_lr:
    enabled: true
    backbone_shallow_lr: !!float 3.0e-5
    backbone_deep_lr: !!float 1.0e-4
    head_lr: !!float 1.0e-3
  weight_decay: !!float 1e-2
  ema:
    enabled: true
    decay: 0.999
  loss:
    type: BalancedSoftmax
    tau: !!float 1.0
    label_smoothing: !!float 0.1
  total_epochs: 20
  val_freq: 1
  save_checkpoint_freq: 5
  scheduler:
    type: CosineAnnealingWarmup
    warmup_epochs: 2
    min_lr: !!float 1e-6
  regularization:
    mixup_cutmix:
      enabled: true
      mixup_alpha: 0.8
      cutmix_alpha: 1.0
  metrics:
    accuracy:
      type: AccuracyMetric
    macro_f1:
      type: MacroF1Metric
    balanced_acc:
      type: BalancedAccuracyMetric

logger:
  print_freq: 50
  save_checkpoint_freq: 5

visualization:
  training_plots:
    type: LossVisualizer
  per_class_f1:
    type: PerClassMetricsVisualizer
  confidence_box:
    type: ConfidenceBoxplotVisualizer
  confusion_matrix:
    type: ConfusionMatrixVisualizer
