name: synthetic_animals_capivara_sapo_structured

synthetic:
  source_dir: assets/blender_models
  output_dir: datasets/generated/animals_synthetic_structured_v3
  renderer_backend: python_bpy
  samples_per_model: 300
  image_size: 224
  seed: 20260525
  render_engine: BLENDER_EEVEE
  device: CUDA
  camera_radius_min: 3.7
  camera_radius_max: 6.2
  splits:
    train: 0.8
    val: 0.1
    test: 0.1
  render_options:
    view_strategy: structured
    close_view_ratio: 0.12
    far_view_ratio: 0.20
  class_render_options:
    capivara:
      front_angle_degrees: 180
    sapo:
      front_angle_degrees: 0
