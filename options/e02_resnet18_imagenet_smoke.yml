name: E02_ResNet18_ImageNet_Smoke
model_type: ClassificationModel
num_gpu: 1

datasets:
  train:
    type: ImageFolderClassificationDataset
    root: datasets/generated/animals_synthetic_structured_v3/train
    image_size: 96
    augment: true
    batch_size_per_gpu: 8
    num_worker_per_gpu: 0
  val:
    type: ImageFolderClassificationDataset
    root: datasets/generated/animals_synthetic_structured_v3/val
    image_size: 96
    augment: false
  test:
    type: ImageFolderClassificationDataset
    root: datasets/generated/animals_synthetic_structured_v3/test
    image_size: 96
    augment: false

network_g:
  type: TorchvisionClassifier
  backbone: resnet18
  num_classes: 2
  weights: DEFAULT
  classifier_dropout: 0.0
  freeze_backbone: false

train:
  seed: 42
  deterministic: false
  total_epochs: 1
  save_checkpoint_freq: 1
  val_freq: 1
  optimizer:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-2
  scheduler:
    type: StepLR
    step_size: 1
    gamma: 0.2
  checkpoint:
    monitor: val_accuracy
    mode: max
    save_best: true
    save_last: true
  early_stopping:
    enabled: false
  metrics:
    accuracy:
      type: AccuracyMetric

logger:
  print_freq: 20
  save_checkpoint_freq: 1

visualization:
  training_plots:
    type: LossVisualizer
