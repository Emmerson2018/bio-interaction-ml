name: video_animals

video:
  source_dir: assets/videos
  output_dir: datasets/generated/animals_video
  image_size: 224
  seed: 20260814
  device: cuda
  augmentations_per_frame: 4
  frame_step: 1
  splits:
    train: 0.6
    val: 0.2
    test: 0.2
  augmentations:
    rotation_degrees: 30.0
    affine_shear: 15.0
    perspective_distortion: 0.2
    color_jitter: 0.3
    blur_prob: 0.5
    noise_prob: 0.5
    noise_intensity_min: 0.01
    noise_intensity_max: 0.05
